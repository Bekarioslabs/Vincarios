<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZEUS Agent</title>
  <style>
    :root {
      --background-primary: #111317;
      --background-secondary: #181b20;
      --background-tertiary: #20242b;
      --background-modifier-border: #303640;
      --text-normal: #f1f3f5;
      --text-muted: #a9b0ba;
      --text-accent: #d7a84f;
      --interactive-accent: #d7a84f;
      --font-interface: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background-primary);
      color: var(--text-normal);
      font-family: var(--font-interface);
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(180px, 220px) minmax(420px, 1fr) minmax(360px, 460px);
      grid-template-rows: 1fr auto;
    }

    .left-nav,
    .main-workspace,
    .vault-panel {
      min-height: 0;
      border-right: 1px solid var(--background-modifier-border);
    }

    .left-nav {
      padding: 16px;
      background: var(--background-secondary);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand {
      margin-bottom: 12px;
      color: var(--text-accent);
      font-weight: 700;
    }

    button {
      width: 100%;
      border: 1px solid var(--background-modifier-border);
      background: var(--background-tertiary);
      color: var(--text-normal);
      padding: 9px 10px;
      text-align: left;
      border-radius: 6px;
      font: inherit;
    }

    .main-workspace {
      display: grid;
      grid-template-rows: minmax(240px, 1fr) auto auto auto;
      background: var(--background-primary);
    }

    .vault-panel {
      display: grid;
      grid-template-rows: minmax(220px, 1fr) minmax(240px, 1fr);
      background: var(--background-secondary);
    }

    .chat-placeholder,
    .review-placeholder,
    .context-placeholder,
    .input-placeholder,
    .files-placeholder,
    .preview-placeholder {
      padding: 16px;
      border-bottom: 1px solid var(--background-modifier-border);
      color: var(--text-muted);
    }

    .review-placeholder,
    .context-placeholder,
    .input-placeholder {
      background: var(--background-secondary);
    }

    .status-bar {
      grid-column: 1 / -1;
      padding: 7px 12px;
      border-top: 1px solid var(--background-modifier-border);
      background: var(--background-secondary);
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./src/renderer/shell/mountShell.js"></script>
  <script src="./src/renderer/bootstrap.js"></script>
</body>
</html>
